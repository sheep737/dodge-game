<body>

		【Ver：138】

		<button id="returnDeckMode">山札戻し：OFF</button>

	</div>

	</div>

	<div id="drawPoints">ドロー：0</div>
	<div id="victoryPoints" style="margin-top:10px;font-weight:bold;">勝利点：0</div>
	<div id="topArea">
		<div id="deck">
			<div id="deckImage"></div>
			<div id="deckCount"></div>
		</div>
		<div id="field"></div>
	</div>
	<div id="hand"></div>
	<div id="exitControl">
		<select id="exitPlayerSelect"></select>
		<button id="exitPlayerBtn">
			選択したプレイヤーを退室

	<div id="shopControl">
		追加先：

	</div>

	</div>

	<div id="deckList"></div>
	<h3 id="discardListTitle">捨て札の中身</h3>
	<div id="discardList"></div>
	<h3 id="trashListTitle">破棄</h3>
	<div id="trash"></div>
	<div id="orderEditor" style="margin:10px 0;">

		<div id="playerShopList" class="playerShopList"></div>
		<h3>プレイヤー順</h3>
		<div id="orderList"></div>
		<button id="saveOrderBtn">順番確定</button>
	</div>

	<script type="module">

		const firebaseConfig = {

			measurementId: "G-FG0645HHZD"

		const app = initializeApp(firebaseConfig);

		const roomId = "room1";
		const initialDeck = [

			{ name: "B_銅貨", cost: 0, text: "＋１コイン", type: "treasure", image: "copper.jpeg" },

		const shopDeck = [
			{ name: "冒険家", cost: 3, text: "コスト4以下カード１枚獲得", type: "action", stock: 10, actions: 0, image: "adventurer.jpeg" },
			{ name: "煽動者", cost: 2, text: "＋１アクション\n手札から好きな枚数の\nカードを捨て、その枚数分引く", type: "action", stock: 10, actions: 1, image: "instigator.jpeg" },
			{ name: "炭鉱夫", cost: 5, text: "手札の財宝1枚破棄\nコスト＋３以下の財宝獲得", type: "action", stock: 10, actions: 0, image: "miner.jpeg" },
			{ name: "騎士", cost: 3, text: "＋１カード\n＋２アクション", type: "action", stock: 10, actions: 2, draw: 1, image: "knight.jpeg" },
			{ name: "守銭奴", cost: 4, text: "＋３カード", type: "action", stock: 10, actions: 0, draw: 3, image: "miser.jpeg" },
			{ name: "建築家", cost: 4, text: "手札1枚破棄\nコスト＋２以下カード獲得", type: "action", stock: 10, actions: 0, image: "architect.jpeg" },
			// { name: "民騎士", cost: 4, text: "＋２コイン。他のプレイヤーは手札３枚にする", type: "action", stock: 10, actions: 0 },
			{ name: "勇者", cost: 5, text: "＋１カード\n＋１アクション\n＋１購入", type: "action", stock: 10, actions: 1, draw: 1, image: "hero.jpeg" },
			// { name: "経営者", cost: 3, text: "＋１カード\n＋１アクション\n銀貨を使うと＋１コイン", type: "action", stock: 10, actions: 1, draw: 1 },
			// { name: "堀", cost: 2, text: "アタック時に公開すると無効化", type: "action", stock: 10, actions: 0 },
			{ name: "銅貨", cost: 0, text: "＋１コイン", type: "treasure", stock: 32, actions: 0, image: "copper.jpeg" },
			{ name: "銀貨", cost: 3, text: "＋２コイン", type: "treasure", stock: 40, actions: 0, image: "silver.jpeg" },
			{ name: "金貨", cost: 6, text: "＋３コイン", type: "treasure", stock: 30, actions: 0, image: "gold.jpeg" },
			{ name: "村", cost: 2, text: "勝利点１", type: "victory", stock: 12, actions: 0, image: "village.jpeg" },
			{ name: "街", cost: 5, text: "勝利点３", type: "victory", stock: 12, actions: 0, image: "town.jpeg" }
			, { name: "都市", cost: 8, text: "勝利点６", type: "victory", stock: 18, actions: 0, image: "urban.jpeg" }
		];

		const pv_urlParams = new URLSearchParams(window.location.search);
		const pv_playerId = pv_urlParams.get("player") || "playerA";
		const isShop = pv_playerId === "shop";
		const targetPlayer = pv_urlParams.get("target") || "playerA";

		const roomRef = ref(db, `rooms/${roomId}`);
		const pv_db_deck = ref(db, `rooms/${roomId}/decks/${pv_playerId}`);
		const pv_db_hand = ref(db, `rooms/${roomId}/hands/${pv_playerId}`);
		const pv_db_shopDeck = ref(db, `rooms/${roomId}/shopDeck`);
		const pv_db_field = ref(db, `rooms/${roomId}/fields/${pv_playerId}`);
		const pv_db_discard = ref(db, `rooms/${roomId}/discards/${pv_playerId}`);
		const pv_db_turn = ref(db, `rooms/${roomId}/turn/current`);
		const pv_db_trash = ref(db, `rooms/${roomId}/trashes/${pv_playerId}`);

		let currentTurnPlayer = null;
		let currentTurnFieldUnsub = null;

		// ===== shop用状態 =====
		let shopPlayers = {};
		let shopFields = {};
		let shopTrashes = {};

		// ■■■■■■■■■■■■■■■■■■■■■■■■■■■
		// ■    リアルタイム表示      ■
		// ■■■■■■■■■■■■■■■■■■■■■■■■■■■
		// ●--------描画：デッキ--------●
		if (!isShop) {
			onValue(pv_db_deck, (snap) => {
				const deck = snap.val() || [];
				document.getElementById("deckCount").innerText = `残り：${deck.length}枚`;
				document.getElementById("deckImage").style.opacity =
					deck.length === 0 ? "0.3" : "1";
			});
		}

		// ===== shop画面：各プレイヤーの場を監視 =====
		if (isShop) {
			onValue(ref(db, `rooms/${roomId}/players`), snap => {
				shopPlayers = snap.val() || {};
				renderShopFields();
			});
			onValue(ref(db, `rooms/${roomId}/fields`), snap => {
				shopFields = snap.val() || {};
				renderShopFields();
			});
			onValue(ref(db, `rooms/${roomId}/trashes`), snap => {
				shopTrashes = snap.val() || {};
				renderShopFields();
			});
		}

		// ●--------描画：手札--------●
		onValue(pv_db_hand, (lv_snapshot_hand) => {
			if (isShop) return;
			const lv_hand = lv_snapshot_hand.val() || [];
			const handDiv = document.getElementById("hand");
			handDiv.innerHTML = "";

			lv_hand.forEach((card, index) => {
				const btn = document.createElement("div");
				btn.className = `cardButton ${card.type || ""}`;
				btn.innerHTML = `
  <div class="cardCost">${card.cost}</div>
  <img class="cardImage" src="${card.image || ''}">
  <div class="cardName">${card.name}</div>
  <div class="cardText">${card.text.replace(/\n/g, "<br>")}</div>
`;
				let pressTimer = null;
				let longPress = false;
				let moved = false;

				// タッチ開始
				btn.addEventListener("touchstart", () => {
					longPress = false;
					moved = false;

					pressTimer = setTimeout(() => {
						longPress = true;
						showCardModal(card);
					}, 500);
				}, { passive: true });

				// 指が動いた（＝スクロール）
				btn.addEventListener("touchmove", () => {
					moved = true;
					clearTimeout(pressTimer);
				}, { passive: true });

				// 指を離した
				btn.addEventListener("touchend", () => {
					clearTimeout(pressTimer);

					if (moved || longPress) return;

					if (isTrashMode) {
						trashCard(index);
					} else if (isDiscardMode) {
						discardCard(index);
					} else if (isReturnDeckMode) {
						returnHandCardToDeck(index);
					} else if (isReturnSupplyMode) {
    					returnHandCardToSupply(index);
					} else {
						playCard(index);
					}
				});

				// キャンセル
				btn.addEventListener("touchcancel", () => {
					clearTimeout(pressTimer);
				});

				handDiv.appendChild(btn);
			});
		});

		// ●--------描画：場--------●
		onValue(ref(db, `rooms/${roomId}/turn/current`), (turnSnap) => {
			const turnPlayer = turnSnap.val();
			if (!turnPlayer) return;

			// ★ 以前の監視を解除
			if (currentTurnFieldUnsub) {
				currentTurnFieldUnsub();
				currentTurnFieldUnsub = null;
			}

			const turnFieldRef = ref(db, `rooms/${roomId}/fields/${turnPlayer}`);

			currentTurnFieldUnsub = onValue(turnFieldRef, (snap) => {
				const cards = snap.val() || [];
				const fieldDiv = document.getElementById("field");
				fieldDiv.innerHTML = "";

				if (cards.length === 0) {
					const empty = document.createElement("div");
					empty.style.width = "80px";
					empty.style.height = "120px";
					empty.style.border = "2px dashed #aaa";
					empty.style.borderRadius = "10px";
					fieldDiv.appendChild(empty);
					return;
				}

				cards.forEach((card, index) => {
					const cardEl = document.createElement("div");
					cardEl.className = `cardButton ${card.type || ""}`;
					cardEl.innerHTML = `
			  <div class="cardCost">${card.cost}</div>
			  <div class="cardName">${card.name}</div>
			  <div class="cardText">${card.text.replace(/\n/g, "<br>")}</div>
			`;
					cardEl.onclick = () => {
						if (isReturnHandMode) {
							returnFieldCardToHand(index);
						}
					};

					fieldDiv.appendChild(cardEl);
				});

				// ★ 最新カードが見えるように右端へ
				fieldDiv.scrollTo({
					left: fieldDiv.scrollWidth,
					behavior: "smooth"
				});

			});
		});

		onValue(ref(db, `rooms/${roomId}/players`), snap => {
			const players = snap.val() || {};
			const div = document.getElementById("playerList");
			if (!isShop) {
				div.innerHTML = "参加者：" + Object.keys(players).join(", ");
				return;
			}

			renderExitPlayerList(players);

			div.innerHTML = "";

			if (isShop) {
				renderTargetPlayerSelect(players);
				document.getElementById("endTurn").style.display = "none";
				document.getElementById("endTurnInfo").style.display = "none";
				loadOrderEditor(players);
			}
		});

		onValue(ref(db, `rooms/${roomId}/lastEndTurn`), snap => {
			const data = snap.val();
			if (!data) return;

			const date = new Date(data.at);
			const time = date.toLocaleTimeString();

			document.getElementById("endTurnInfo").textContent =
				`最後にターン終了：${data.player}（${time}）`;
		});

		onValue(pv_db_turn, snap => {
			currentTurnPlayer = snap.val();
			updateTurnUI();

			if (isShop) {
				get(ref(db, `rooms/${roomId}/players`)).then(snap => {
					renderTargetPlayerSelect(snap.val() || {});
				});
			}
		});

		onValue(pv_db_trash, snap => {
			if (isShop) return;

			const trash = snap.val() || [];
			const div = document.getElementById("trash");
			div.innerHTML = "";

			trash.forEach((card, index) => {
				const el = document.createElement("div");
				el.className = `cardButton ${card.type || ""}`;
				el.innerHTML = `
    <div class="cardCost">${card.cost}</div>
    <div class="cardName">${card.name}</div>
  `;

				el.onclick = () => {
					if (isReturnHandMode) {
						returnTrashCardToHand(index);
					}
				};

				div.appendChild(el);
			});
		});

		onValue(pv_db_deck, snap => {
			if (isShop) return;

			const deck = snap.val() || [];
			const list = document.getElementById("deckList");
			list.innerHTML = "";

			deck.forEach(card => {
				const el = document.createElement("div");
				el.className = `cardButton ${card.type || ""}`;
				el.innerHTML = `
      <div class="cardCost">${card.cost}</div>
      <div class="cardName">${card.name}</div>
    `;
				list.appendChild(el);
			});
		});

		onValue(pv_db_discard, snap => {
			if (isShop) return;

			const discard = snap.val() || [];
			const list = document.getElementById("discardList");
			list.innerHTML = "";

			discard.forEach((card, index) => {
				const el = document.createElement("div");
				el.className = `cardButton ${card.type || ""}`;
				el.innerHTML = `
      <div class="cardCost">${card.cost}</div>
      <div class="cardName">${card.name}</div>
    `;

				el.onclick = () => {
					if (isReturnHandMode){
						returnDiscardToHand(index)
					} else if (isReturnSupplyMode) {
        				returnDiscardCardToSupply(index);
					}
				};

				list.appendChild(el);
			});
		});

		onValue(ref(db, `rooms/${roomId}/turn/orderLocked`), snap => {
			if (snap.val()) {
				document.getElementById("orderEditor").style.display = "none";
			}
		});

		onValue(ref(db, `rooms/${roomId}/shopDeck`), snap => {
			const cards = snap.val() || [];
			renderPlayerShop(cards);
		});

		// ■■■■■■■■■■■■■■■■■■■■■■■■■■■
		// ■    ボタン動作            ■
		// ■■■■■■■■■■■■■■■■■■■■■■■■■■■

		// ●--------ボタン：カードを引く--------●
		document.getElementById("deckImage").addEventListener("click", drawCard);

		// ●--------ボタン：リセット--------●
		document.getElementById("reset").addEventListener("click", resetGame);

		// ●--------ボタン：シャッフル--------●
		document.getElementById("shuffleDeck").addEventListener("click", shuffleDeck);

		// ●--------ボタン：場を山札に戻す--------●
		document.getElementById("returnToDeck").addEventListener("click", returnDiscardToDeck);
		document.getElementById("leaveRoom").addEventListener("click", leaveRoom);

		document.getElementById("endTurn").addEventListener("click", endTurn);

		let isTrashMode = false;
		let isDiscardMode = false;
		let isReturnDeckMode = false;
		let isReturnHandMode = false;
		let isReturnFieldMode = false;
		let isReturnSupplyMode = false;

		document.getElementById("trashMode").addEventListener("click", () => {
			isTrashMode = !isTrashMode;

			if (isTrashMode) {
				isReturnHandMode = false;
				isReturnFieldMode = false;

				document.body.classList.remove("returnHandMode");
				document.getElementById("returnHandMode").textContent = "手札戻し：OFF";
			}

			document.body.classList.toggle("trashMode", isTrashMode);
			document.getElementById("trashMode").textContent =
				`破棄モード：${isTrashMode ? "ON" : "OFF"}`;
		});

		document.getElementById("returnDeckMode").addEventListener("click", () => {
			isReturnDeckMode = !isReturnDeckMode;

			if (isReturnDeckMode) {
				isTrashMode = false;
				isReturnFieldMode = false;

				document.body.classList.remove("trashMode");
				document.getElementById("trashMode").textContent = "破棄モード：OFF";
			}

			document.body.classList.toggle("returnDeckMode", isReturnDeckMode);
			document.getElementById("returnDeckMode").textContent =
				`山札戻し：${isReturnDeckMode ? "ON" : "OFF"}`;
		});

		document.getElementById("returnHandMode").addEventListener("click", () => {
			isReturnHandMode = !isReturnHandMode;

			if (isReturnHandMode) {
				isTrashMode = false;
				isReturnFieldMode = false;

				document.body.classList.remove("trashMode");
				document.getElementById("trashMode").textContent = "破棄モード：OFF";
			}

			document.body.classList.toggle("returnHandMode", isReturnHandMode);
			document.getElementById("returnHandMode").textContent =
				`手札戻し：${isReturnHandMode ? "ON" : "OFF"}`;
		});

		document.getElementById("saveOrderBtn").addEventListener("click", savePlayerOrder);

		document.getElementById("exitPlayerBtn").onclick = () => {
			const playerId =
				document.getElementById("exitPlayerSelect").value;

			if (!playerId) return;

			kickPlayer(playerId);
		};

		document.getElementById("discardMode").addEventListener("click", () => {
			isDiscardMode = !isDiscardMode;

			if (isDiscardMode) {
				isTrashMode = false;
				isReturnHandMode = false;
				isReturnFieldMode = false;

				document.body.classList.remove(
					"trashMode",
					"returnHandMode"
				);

				document.getElementById("trashMode").textContent = "破棄モード：OFF";
				document.getElementById("returnHandMode").textContent = "手札戻し：OFF";
			}

			document.body.classList.toggle("discardMode", isDiscardMode);
			document.getElementById("discardMode").textContent =
				`捨てるモード：${isDiscardMode ? "ON" : "OFF"}`;
		});

document.getElementById("returnSupplyMode").addEventListener("click", () => {
    if (isReturnSupplyMode) {
        clearModes();
        return;
    }

    clearModes();
    isReturnSupplyMode = true;
    document.body.classList.add("returnSupplyMode");
    document.getElementById("returnSupplyMode").textContent = "サプライ戻し：ON";
});

		if (isShop) {
			document.getElementById("deckImage").style.pointerEvents = "none";
			document.getElementById("deckImage").style.opacity = "0.5";
			document.getElementById("shuffleDeck").style.display = "none";
			document.getElementById("returnToDeck").style.display = "none";
			document.getElementById("trashMode").style.display = "none";
			document.getElementById("returnHandMode").style.display = "none";
			document.getElementById("topArea").style.display = "none";
			document.getElementById("hand").style.display = "none";
			document.getElementById("leaveRoom").style.display = "none";
			document.getElementById("deckListTitle").style.display = "none";
			document.getElementById("discardListTitle").style.display = "none";
			document.getElementById("trashListTitle").style.display = "none";
			document.getElementById("actionPoints").style.display = "none";
			document.getElementById("victoryPoints").style.display = "none";
			document.getElementById("drawPoints").style.display = "none";
			document.getElementById("returnDeckMode").style.display = "none";
			document.getElementById("discardMode").style.display = "none";
			document.getElementById("returnSupplyMode").style.display = "none";
		} else {
			document.getElementById("shopControl").style.display = "none";
			document.getElementById("reset").style.display = "none";
			document.getElementById("exitControl").style.display = "none";
		}

		// ■    関数                 ■
		// ■■■■■■■■■■■■■■■■■■■■■■■■■■■
		// ●--------カードを引く--------●
		async function drawCard() {
			if (!isMyTurn()) {
				alert("あなたのターンではありません");
				return;
			}

			// 残ドロー確認
			const drawSnap = await get(ref(db, `rooms/${roomId}/turn/draws`));
			let draws = drawSnap.val() ?? 0;

			// 山札・手札取得
			const deckSnap = await get(pv_db_deck);
			const handSnap = await get(pv_db_hand);

			let deck = deckSnap.val() || [];
			let hand = handSnap.val() || [];

			if (deck.length === 0) {
				alert("山札がありません");
				return;
			}

			// 1枚引く
			const card = deck.shift();
			hand.push(card);

			// ドロー消費
			draws -= 1;

			// まとめて更新
			await update(roomRef, {
				[`decks/${pv_playerId}`]: deck,
				[`hands/${pv_playerId}`]: hand,
				"turn/draws": draws
			});
		}

		// ●--------場に出す--------●
		async function playCard(cardIndex) {
			const handSnap = await get(pv_db_hand);
			const fieldSnap = await get(ref(db, `rooms/${roomId}/fields/${pv_playerId}`));
			const actionSnap = await get(ref(db, `rooms/${roomId}/turn/actions`));

			let hand = handSnap.val() || [];
			let field = fieldSnap.val() || [];
			let action = actionSnap.val() ?? 0;

			const card = hand[cardIndex];
			if (!card) return;

			// ▼ アクションカードの場合
			if (card.type === "action") {
				if (action <= 0) {
					alert("アクションが足りません");
					return;
				}
				action -= 1;
				action += card.actions || 0;

				// ★ ドロー加算
				if (card.draw) {
					const drawSnap = await get(ref(db, `rooms/${roomId}/turn/draws`));
					let draws = drawSnap.val() ?? 0;
					draws += card.draw;

					await update(roomRef, {
						"turn/draws": draws
					});
				}
			}

			// ▼ 手札→場
			hand.splice(cardIndex, 1);
			field.push(card);

			await update(roomRef, {
				[`hands/${pv_playerId}`]: hand,
				[`fields/${pv_playerId}`]: field,
				"turn/actions": action
			});
		}

		// ●--------リセット--------●
		async function resetGame() {
			if (!confirm("ゲームをリセットしますか？")) return;

			const playersSnap = await get(ref(db, `rooms/${roomId}/players`));
			const players = playersSnap.val() || {};

			const decks = {};
			const hands = {};
			const fields = {};
			const discards = {};
			const trashes = {};

			const ordered = Object.entries(players)
				.filter(([pid]) => pid !== "shop")
				.sort((a, b) => {
					if (a[1].order == null) return 1;
					if (b[1].order == null) return -1;
					return a[1].order - b[1].order;
				})
				.map(([pid]) => pid);

			Object.keys(players).forEach(pid => {
				const deck = [...initialDeck];
				shuffleArray(deck);
				decks[pid] = deck;
				hands[pid] = [];
				fields[pid] = [];
				trashes[pid] = [];
				discards[pid] = [];
			});

			await update(roomRef, {
				decks,
				hands,
				fields,
				discards,
				trashes,

				shopDeck: shopDeck.map(card => ({
					...card,
					stock: card.stock
				})),

				"turn/current": ordered[0] || null,
				"turn/actions": 1,
				"turn/draws": 5,
				"turn/orderLocked": false
			});
		}

		// ●--------シャッフル実行--------●
		async function shuffleDeck() {
			const deckSnap = await get(pv_db_deck);
			let deck = deckSnap.val() || [];

			if (deck.length <= 1) {
				alert("シャッフルするカードがありません");
				return;
			}

			shuffleArray(deck);

			await update(roomRef, {
				[`decks/${pv_playerId}`]: deck
			});
		}

		// ●--------デッキをシャッフル--------●
		function shuffleArray(array) {
			for (let i = array.length - 1; i > 0; i--) {
				const j = Math.floor(Math.random() * (i + 1));
				[array[i], array[j]] = [array[j], array[i]];
			}
		}

		// ●--------捨て札のカードを山札に戻す--------●
		async function returnDiscardToDeck() {
			if (!confirm("捨て札をすべて山札に戻しますか？")) return;

			const deckSnap = await get(pv_db_deck);
			const discardSnap = await get(pv_db_discard);

			let deck = deckSnap.val() || [];
			let discard = discardSnap.val() || [];

			if (discard.length === 0) {
				alert("捨て札がありません");
				return;
			}

			// 捨て札を山札の下に戻す
			deck = deck.concat(discard);

			await update(roomRef, {
				[`decks/${pv_playerId}`]: deck,
				[`discards/${pv_playerId}`]: []
			});
		}

		async function endTurn() {
			if (!isMyTurn()) return;

			clearModes();

			// ★ ここで playersData を正しく取得する
			const playersSnap = await get(ref(db, `rooms/${roomId}/players`));
			const playersData = playersSnap.val() || {};

			const players = Object.entries(playersData)
				.filter(([pid]) => pid !== "shop")
				.sort((a, b) => {
					if (a[1].order == null) return 1;
					if (b[1].order == null) return -1;
					return a[1].order - b[1].order;
				})
				.map(([pid]) => pid);

			const currentIndex = players.indexOf(pv_playerId);
			const nextPlayer = players[(currentIndex + 1) % players.length];

			// 場・手札 → 捨て札
			const fieldSnap = await get(pv_db_field);
			const handSnap = await get(pv_db_hand);
			const discardSnap = await get(pv_db_discard);

			const field = fieldSnap.val() || [];
			const hand = handSnap.val() || [];
			const discard = discardSnap.val() || [];

			// 場を捨て札へ
			if (field.length > 0) {
				discard.push(...field);
			}

			// ★ 手札を捨て札へ
			if (hand.length > 0) {
				discard.push(...hand);
			}

			await update(roomRef, {
				[`fields/${pv_playerId}`]: [],
				[`hands/${pv_playerId}`]: [],
				[`discards/${pv_playerId}`]: discard,
				"turn/current": nextPlayer,
				"turn/actions": 1,
				"turn/draws": 5,
				lastEndTurn: {
					player: pv_playerId,
					at: Date.now()
				}
			});
		}

			const trashSnap = await get(pv_db_trash);

		function getVictoryPoints(card) {
			if (card.type !== "victory") return 0;

			if (card.name.includes("村")) return 1;
			if (card.name.includes("街")) return 3;
			if (card.name.includes("都市")) return 6;

			return 0;
		}

		function calculateTotalVictoryPoints({
			deck = [],
			hand = [],
			discard = [],
			field = []
		}) {
			const allCards = [
				...deck,
				...hand,
				...discard,
				...field
			];

			return allCards.reduce(
				(sum, card) => sum + getVictoryPoints(card),
				0
			);
		}

			onValue(pv_db_deck, snap => {
				deck = snap.val() || [];
				updateVP();

			onValue(pv_db_hand, snap => {
				hand = snap.val() || [];
				updateVP();
			});

			onValue(pv_db_discard, snap => {
				discard = snap.val() || [];
				updateVP();
			});

			onValue(pv_db_field, snap => {
				field = snap.val() || [];
				updateVP();
			});

		function renderOrderEditor() {
			const div = document.getElementById("orderList");
			div.innerHTML = "";

			tempOrder.forEach((pid, i) => {
				const row = document.createElement("div");
				row.textContent = `${i + 1}. ${pid} `;

				const up = document.createElement("button");
				up.textContent = "↑";
				up.addEventListener("click", () => moveOrderUp(i));

				const down = document.createElement("button");
				down.textContent = "↓";
				down.addEventListener("click", () => moveOrderDown(i));

				row.appendChild(up);
				row.appendChild(down);
				div.appendChild(row);
			});
		}

		function moveOrderUp(i) {
			if (i === 0) return;
			[tempOrder[i - 1], tempOrder[i]] =
				[tempOrder[i], tempOrder[i - 1]];
			renderOrderEditor();
		}

		function moveOrderDown(i) {
			if (i === tempOrder.length - 1) return;
			[tempOrder[i + 1], tempOrder[i]] =
				[tempOrder[i], tempOrder[i + 1]];
			renderOrderEditor();
		}

				name.textContent = card.name;

				const text = document.createElement("div");
				text.className = "cardText";
				text.innerHTML = card.text
					? card.text.replace(/\n/g, "<br>")
					: "";

				const cost = document.createElement("div");
				cost.className = "cost";
				cost.textContent = `💰${card.cost}`;

				div.appendChild(img);
				div.appendChild(name);
				div.appendChild(text);   // ← ★ 効果文を追加
				div.appendChild(cost);

				list.appendChild(div);
			});
		}

		async function kickPlayer(playerId) {
			if (!isShop) return;

			if (!confirm(`${playerId} を退室させますか？`)) return;

			const updates = {};
			updates[`players/${playerId}`] = null;
			updates[`decks/${playerId}`] = null;
			updates[`hands/${playerId}`] = null;
			updates[`fields/${playerId}`] = null;
			updates[`discards/${playerId}`] = null;
			updates[`trashes/${playerId}`] = null;

			// ▼ ターン中プレイヤーだった場合の保険
			const turnSnap = await get(ref(db, `rooms/${roomId}/turn/current`));
			const current = turnSnap.val();

			if (current === playerId) {
				const playersSnap = await get(ref(db, `rooms/${roomId}/players`));
				const players = Object.keys(playersSnap.val() || {})
					.filter(p => p !== "shop" && p !== playerId);

				updates["turn/current"] = players[0] ?? null;
			}

			await update(roomRef, updates);

			showToast(`${playerId} を退室させました`);
		}

		function renderExitPlayerList(players) {
			const select = document.getElementById("exitPlayerSelect");
			select.innerHTML = "";

			Object.keys(players).forEach(pid => {
				if (pid === "shop") return;

				const opt = document.createElement("option");
				opt.value = pid;       // ★ playerId
				opt.textContent = pid;
				select.appendChild(opt);
			});
		}

		async function returnTrashCardToHand(cardIndex) {
			if (!isMyTurn()) {
				alert("あなたのターンではありません");
				return;
			}

			const trashSnap = await get(pv_db_trash);
			const handSnap = await get(pv_db_hand);

			let trash = trashSnap.val() || [];
			let hand = handSnap.val() || [];

			if (!trash[cardIndex]) return;

			const card = trash.splice(cardIndex, 1)[0];
			hand.push(card); // ★ 手札の最後に戻す

			await update(roomRef, {
				[`trashes/${pv_playerId}`]: trash,
				[`hands/${pv_playerId}`]: hand
			});
		}

		async function returnDiscardToHand(cardIndex) {
			if (!isMyTurn()) {
				alert("あなたのターンではありません");
				return;
			}

			const discardSnap = await get(pv_db_discard);
			const handSnap = await get(pv_db_hand);

			let discard = discardSnap.val() || [];
			let hand = handSnap.val() || [];

			if (!discard[cardIndex]) return;

			const card = discard.splice(cardIndex, 1)[0];
			hand.push(card);

			await update(roomRef, {
				[`discards/${pv_playerId}`]: discard,
				[`hands/${pv_playerId}`]: hand
			});
		}


function clearModes() {
    isTrashMode = false;
    isDiscardMode = false;
    isReturnHandMode = false;
    isReturnDeckMode = false;
    isReturnSupplyMode = false;

    document.body.classList.remove(
        "trashMode",
        "discardMode",
        "returnHandMode",
        "returnDeckMode",
        "returnSupplyMode"
    );

    document.getElementById("trashMode").textContent = "破棄モード：OFF";
    document.getElementById("discardMode").textContent = "捨てるモード：OFF";
    document.getElementById("returnHandMode").textContent = "手札戻し：OFF";
    document.getElementById("returnDeckMode").textContent = "山札戻し：OFF";
    document.getElementById("returnSupplyMode").textContent = "サプライ戻し：OFF";
}

		function enterDiscardMode() {
			clearModes();
			isDiscardMode = true;
			document.body.classList.add("discardMode");
		}

		function exitDiscardMode() {
			isDiscardMode = false;
			document.body.classList.remove("discardMode");
		}

		async function discardCard(cardIndex) {
			if (!isMyTurn()) {
				alert("あなたのターンではありません");
				return;
			}

			const handSnap = await get(pv_db_hand);
			const discardSnap = await get(pv_db_discard);

			let hand = handSnap.val() || [];
			let discard = discardSnap.val() || [];

			if (!hand[cardIndex]) return;

			const card = hand.splice(cardIndex, 1)[0];
			discard.push(card);

			await update(roomRef, {
				[`hands/${pv_playerId}`]: hand,
				[`discards/${pv_playerId}`]: discard
			});
		}

async function returnHandCardToSupply(cardIndex) {
    if (!isMyTurn()) {
        alert("あなたのターンではありません");
        return;
    }

    const handSnap = await get(pv_db_hand);
    const shopSnap = await get(pv_db_shopDeck);

    let hand = handSnap.val() || [];
    let shopDeck = shopSnap.val() || [];

    const card = hand[cardIndex];
    if (!card) return;

    // 手札から削除
    hand.splice(cardIndex, 1);

    // 🔍 同名サプライを探す
    const supply = shopDeck.find(s => s.name === card.name);

    if (supply) {
        // 既存サプライに戻す
        supply.stock = (supply.stock || 0) + 1;
    } else {
        // 新規サプライとして追加
        shopDeck.push({
            name: card.name,
            cost: card.cost,
            image: card.image,
            text: card.text,
            type: card.type,
            stock: 1
        });
    }

    await update(roomRef, {
        [`hands/${pv_playerId}`]: hand,
        shopDeck: shopDeck
    });

    clearModes();
}

async function returnDiscardCardToSupply(cardIndex) {
    if (!isMyTurn()) {
        alert("あなたのターンではありません");
        return;
    }

    const discardSnap = await get(pv_db_discard);
    const shopSnap = await get(pv_db_shopDeck);

    let discard = discardSnap.val() || [];
    let shopDeck = shopSnap.val() || [];

    const card = discard[cardIndex];
    if (!card) return;

    // 捨て札から削除
    discard.splice(cardIndex, 1);

    // 同名サプライを探す
    const supply = shopDeck.find(s => s.name === card.name);

    if (supply) {
        supply.stock = (supply.stock || 0) + 1;
    } else {
        shopDeck.push({
            name: card.name,
            cost: card.cost,
            image: card.image,
            text: card.text,
            type: card.type,
            stock: 1
        });
    }

    await update(roomRef, {
        [`discards/${pv_playerId}`]: discard,
        shopDeck: shopDeck
    });

    clearModes();
}
